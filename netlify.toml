[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/addon/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/addon/*"
  to = "/.netlify/functions/addon/addon/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/configure"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https:; img-src 'self' data:; base-uri 'self'; frame-ancestors 'none'"
